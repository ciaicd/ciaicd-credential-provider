apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-reader
  namespace: production
---
# Allow kubelets to request this audience for this ServiceAccount in production.
# This is needed with ServiceAccountNodeAudienceRestriction and NodeRestriction enabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ciaicd-image-pull-audience
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["ciaicd-image-pull"]
    resourceNames: ["image-reader"]
    verbs: ["request-serviceaccounts-token-audience"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ciaicd-image-pull-audience
  namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ciaicd-image-pull-audience
subjects:
  - kind: Group
    name: system:nodes
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: image-pull-example
  namespace: production
spec:
  serviceAccountName: image-reader
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.example.com/docker-hosted/team/myapp:1.0.0
      imagePullPolicy: Always
